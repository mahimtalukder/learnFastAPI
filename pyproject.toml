[project]
name = "leanfastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Md. Mahim Talukder", email = "mahim4163@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "pip>=26.2.1",
    "sqlalchemy>=2.0.52",
    "unicorn>=2.1.4",
    "uvicorn>=0.52.4",
]

[project.scripts]
leanfastapi = "leanfastapi:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
